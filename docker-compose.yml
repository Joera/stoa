services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - VENICE_INFERENCE_KEY=${VENICE_INFERENCE_KEY:-}
      - MODEL=${MODEL:-deepseek-v4-flash-0731}
      - VENICE_BASE_URL=${VENICE_BASE_URL:-https://api.venice.ai/api/v1}
    volumes:
      - stoa-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  stoa-data:
