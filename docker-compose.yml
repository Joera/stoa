services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    # Key + model config come from server/.env at compose time (never baked into
    # the image — .env is gitignored + dockerignored). Create it from
    # server/.env.example if missing. Dockerfile ENV defaults cover the rest.
    env_file:
      - server/.env
    ports:
      - "8080:8080"
    volumes:
      - stoa-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  stoa-data:
